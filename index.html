    <!-- 防止主题闪烁（FOUC）：在 React 挂载前同步读取 localStorage 并应用主题 class -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("FreeAPI-theme");
          if (stored) {
            var theme = JSON.parse(stored);
            var isDark = theme.state ? theme.state.theme === "dark" : true;
            document.documentElement.classList.toggle("dark", isDark);
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
