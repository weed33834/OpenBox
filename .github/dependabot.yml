version: 2
updates:
  # npm (FreeAPI 前端)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    auto-merge:
      enabled: false
    open-pull-requests-limit: 2
  # pip (FreeNode 流水线)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
