<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0e14"/>
  <!-- Subtle grid -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#1f2937" stroke-opacity="0.6"/>
  <!-- Glow halo behind the symbol -->
  <circle cx="32" cy="32" r="20" fill="#00e5ff" fill-opacity="0.06"/>
  <!-- Terminal/API symbol: </>  with connection node -->
  <!-- Left angle bracket -->
  <path d="M26 20 L16 32 L26 44" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right angle bracket -->
  <path d="M38 20 L48 32 L38 44" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Center slash -->
  <line x1="36" y1="18" x2="28" y2="46" stroke="#ff2e88" stroke-width="3" stroke-linecap="round"/>
  <!-- Connection dot (top-right) -->
  <circle cx="50" cy="16" r="3" fill="#34d399"/>
  <circle cx="50" cy="16" r="5" fill="#34d399" fill-opacity="0.2"/>
</svg>
